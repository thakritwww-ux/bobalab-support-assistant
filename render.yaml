services:
  - type: web
    name: bobalab-support-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: sh scripts/start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.14
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REVIEWER_API_KEY
        sync: false
      - key: DAILY_MODEL_CALL_LIMIT
        value: "100"
      - key: REQUESTS_PER_MINUTE
        value: "10"
      - key: MODEL_TIMEOUT_SECONDS
        value: "20"
